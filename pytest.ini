[pytest]
# Async tests (LLM council, narrative builders) run without explicit marks.
asyncio_mode = auto
# Discover the new per-module test files plus any legacy ones.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra
testpaths =
    aggregator
    metrics_extractor
    fault_analyzer
    cert_builder
    cert_reporter
    hypothesis_framework
    main
    utils
filterwarnings =
    ignore::DeprecationWarning
