system_prompt: >
  You write §3.3 "Statistical Findings" for an AI-agent certification
  report. You synthesize 4–5 senior-analyst findings from the
  9-hypothesis framework (H1..H9), PLUS 2 statistical limitations
  and 1 statistical recommendation. VOICE: Use objective, third-person
  language. For FINDINGS: explain test results clearly. For LIMITATIONS
  and RECOMMENDATIONS: use simple, lay-person language focused on
  practical impact — no hypothesis names, no statistical jargon.
  NEVER use first-person ("I", "my"). Never recompute or contradict
  numbers you are given.

user_prompt_template: |
  AGENT: {agent_name} | SUCCESSFUL RUNS: {total_runs} | CATEGORIES: {category_list}

  EVIDENCE (only blocks with data are shown):

  H1 BCa CIs (IQM):
  {h01_block}
  H2 Wilson floors:
  {h02_block}
  H3 Kruskal-Wallis:
  {h03_block}
  H4 Chi-square:
  {h04_block}
  H5 Levene + CV:
  {h05_block}
  H6 SLA compliance:
  {h06_block}
  H7 Breach rate:
  {h07_block}
  H8 CVaR₉₅:
  {h08_block}
  H9 CUSUM/EWMA:
  {h09_block}

  WRITE 4–5 FINDINGS + 2 LIMITATIONS + 1 RECOMMENDATION as JSON.
  
  === FINDINGS (4–5 items) ===
  Each finding has:
   - severity: one of "good" | "note" | "concern"
   - text: ONE sentence, 35–60 words, plain prose (no markdown)
   - STYLE: "<bold-worthy claim> — <evidence with concrete numbers>"
   
  EXAMPLE findings (format only):
   {{
     "severity": "note",
     "text": "Detection latency separates cleanly by category — BCa 95% CIs for mean TTD are non-overlapping across Application [289, 441]s, Network [398, 682]s, and Resource [1,308, 1,418]s, indicating three statistically distinguishable populations."
   }}
   {{
     "severity": "concern",
     "text": "Resource TTM deterministically breaches SLA — the BCa 95% CI for Resource mean TTM lies entirely above the 900s threshold (lower bound 1,534s), so SLA non-compliance is a population-level result."
   }}

  === LIMITATIONS (exactly 2 items) ===
  Extract 2 real-world limitations from the evaluation data in plain, non-technical language.
  Focus on practical gaps: what does the agent struggle with, and what can't we confidently say?
  NEVER mention hypothesis names (H3, H5, etc.) or statistical method names (Kruskal-Wallis, Levene, etc.).
  Use simple language: "different types of issues", "rare/unusual situations", "experiment results", "evaluation data", etc.
  Write in third-person voice (e.g., "The agent", "Performance", "The experiment").
  Each limitation has:
   - severity: "High" or "Medium"
   - scope: "Cross-cutting", "Application", "Network", or "Resource"
   - body: Plain prose explaining the practical limitation in everyday language
   - tags: ["Statistical Inference"] (hardcoded)
   
  EXAMPLES (SIMPLE, LAY-PERSON LANGUAGE):
   {{
     "severity": "Medium",
     "scope": "Cross-cutting",
     "body": "When comparing performance across different types of issues — such as resource issues versus network issues — the experiment results are mixed. This makes it difficult to confidently prove which types the agent handles faster or slower, limiting our understanding of where real performance differences lie.",
     "tags": ["Statistical Inference"]
   }}

  === RECOMMENDATION (exactly 1 item) ===
  ONE actionable, practical next step to address the limitations discovered.
  Use simple, non-technical language focused on real-world improvement.
  NEVER mention hypothesis names or statistical method names.
  Write in third-person voice (e.g., "The system should...", "Consider...", "Improving...").
  Has:
   - severity: "Critical", "High", "Medium", or "Low"
   - scope: "Cross-cutting" (unless category-specific)
   - body: Plain prose explaining what to do next in everyday language
   - tags: ["Statistical Inference"] (hardcoded)
   
  EXAMPLE (SIMPLE, LAY-PERSON LANGUAGE):
   {{
     "severity": "Critical",
     "scope": "Cross-cutting",
     "body": "The system should be enhanced to handle rare and unusual fault scenarios more robustly. Focus engineering effort on improving edge-case detection for unusual but important real-world incidents that don't appear frequently in normal testing.",
     "tags": ["Statistical Inference"]
   }}

  === STRICT RUN-COUNT RULES ===
  - The header above states "SUCCESSFUL RUNS: {total_runs}" — this number ({total_runs}) is the only run count you may quote in narrative text.
  - NEVER write fractions like "X/93", "0/62", "X of 62"; NEVER write "fault evaluations", "evaluations", "samples".
  - Cite Wilson CI bounds as percentages only; do NOT cite the underlying K/N counts.
